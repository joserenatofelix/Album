name: album_casamento
description: Álbum de casamento com música de fundo, zoom e proteção contra cópia/print.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.10.0
  screen_protector: ^1.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: GreatVibes
      fonts:
        - asset: assets/fontes/GreatVibes-Regular.ttf
  assets:
    - assets/fotos/
    - assets/fundo/
    - assets/musicas/
